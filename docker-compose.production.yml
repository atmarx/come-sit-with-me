# Come Sit With Me — droplet production stack (runs on xdroplet04).
#
# Publishes 127.0.0.1:3011 so the shared Caddy on the droplet (host network
# mode) can reverse-proxy to it. The Caddy config lives in
# caddy/come-sit-with-me.caddy and is dropped into /opt/caddy-stack/sites/
# during deploy.

name: come-sit-with-me

services:
  app:
    image: ${REGISTRY:-git.dev.xram.net}/${IMAGE_REPO:-atmarx/come-sit-with-me}:${IMAGE_TAG:-latest}
    container_name: come-sit-with-me-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
