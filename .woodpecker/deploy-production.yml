# Come Sit With Me — Deploy to Production (xdroplet04)
#
# SSHs into xdroplet04, stages compose + caddy + deploy script, and runs the
# deploy script by path.  Triggers on tag (production releases only).
#
# COMMAND BUDGET WARNING (2026-08-10): the Woodpecker runner currently
# truncates this step's generated script around the 10th command / a fixed
# byte offset — everything after is silently skipped and the step still goes
# green (pipelines #42, #44-#46; #43's "unterminated quoted string" was the
# cut landing mid-line).  Keep the real work inside the first ~8 commands,
# keep every command short, and treat trailing commands as sacrificial.
# Confirmed by diag5 (pipeline #47): commands 8 and 9 execute, the cut lands
# around 10-11.  diag-droplet.sh stays staged as instrumentation for the next
# incident; run it with fail-after to get a red step with full droplet logs.
#
# Required secrets:
#   - droplet04_ssh_key:  SSH private key for deploy@xdroplet04
#   - droplet04_hostinfo: Pipe-separated "ip|fqdn" for the droplet

when:
  - event: tag

labels:
  host: xdocker01

depends_on:
  - build

steps:
  - name: deploy-production
    image: alpine:latest
    environment:
      DROPLET_SSH_KEY:
        from_secret: droplet04_ssh_key
      DROPLET_HOSTINFO:
        from_secret: droplet04_hostinfo
    commands:
      - apk add --no-cache openssh-client rsync
      - 'export DROPLET_HOST=$(echo "$DROPLET_HOSTINFO" | cut -d"|" -f2)'
      - mkdir -p ~/.ssh
      - echo "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh -o StrictHostKeyChecking=accept-new deploy@"$DROPLET_HOST" "mkdir -p /opt/projects/come-sit-with-me/_staged /opt/projects/come-sit-with-me/caddy"
      - rsync -az docker-compose.production.yml caddy/come-sit-with-me.caddy scripts/deploy-production.sh scripts/diag-droplet.sh deploy@"$DROPLET_HOST":/opt/projects/come-sit-with-me/_staged/
      - ssh deploy@"$DROPLET_HOST" bash /opt/projects/come-sit-with-me/_staged/deploy-production.sh
      - "true"
      - "true"
      - "true"
      - "true"
      - "true"
      - "true"
      - "true"
      - "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
