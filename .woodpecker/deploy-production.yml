# Come Sit With Me — Deploy to Production (xdroplet04)
#
# SSHs into xdroplet04, syncs the working tree to /opt/projects/come-sit-with-me,
# pulls the image from Gitea CR, brings the compose stack up, drops the
# Caddy site config into /opt/caddy-stack/sites/ and reloads Caddy.
#
# Triggers on tag (production releases only).
#
# Required secrets:
#   - droplet04_ssh_key:  SSH private key for deploy@xdroplet04
#   - droplet04_hostinfo: Pipe-separated "ip|fqdn" for the droplet

when:
  - event: tag

labels:
  host: xdocker01

depends_on:
  - build

steps:
  - name: deploy-production
    image: alpine:latest
    environment:
      DROPLET_SSH_KEY:
        from_secret: droplet04_ssh_key
      DROPLET_HOSTINFO:
        from_secret: droplet04_hostinfo
    commands:
      - apk add --no-cache openssh-client rsync
      - 'export DROPLET_IP=$(echo "$DROPLET_HOSTINFO" | cut -d"|" -f1)'
      - 'export DROPLET_HOST=$(echo "$DROPLET_HOSTINFO" | cut -d"|" -f2)'
      - mkdir -p ~/.ssh
      - echo "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -H "$DROPLET_HOST" "$DROPLET_IP" >> ~/.ssh/known_hosts 2>/dev/null
      - ssh -o StrictHostKeyChecking=accept-new deploy@"$DROPLET_HOST" "mkdir -p /opt/projects/come-sit-with-me/caddy /opt/projects/come-sit-with-me/_staged"
      - rsync -az docker-compose.production.yml deploy@"$DROPLET_HOST":/opt/projects/come-sit-with-me/_staged/
      - rsync -az caddy/come-sit-with-me.caddy deploy@"$DROPLET_HOST":/opt/projects/come-sit-with-me/_staged/
      # The runner mangles stdin-redirect commands: "bash < scripts/deploy-production.sh"
      # executed as "bash < scripts/deploy-production." on tag pipelines #34, #35,
      # and #38 (2026-08-10) even though the runner's own echo of the command showed
      # the full filename.  Redirect-free commands in this same step ran clean every
      # time.  So: ship the script with rsync (proven above) and run it by path.
      # --- TEMPORARY v1.2.3 stale-deploy diagnostics (brighid, 2026-08-10). ---
      # Production kept serving the v1.2.2 image after a fully green pull+up.
      # These probes print the droplet-side state before and after the deploy;
      # the final intentional exit 1 makes the step logs retrievable.  Remove
      # once the stale-deploy cause is confirmed.
      - 'ssh -o StrictHostKeyChecking=accept-new deploy@"$DROPLET_HOST" "echo DIAG-PRE; ls -la /opt/projects/come-sit-with-me/; echo ---; cat /opt/projects/come-sit-with-me/.env 2>/dev/null || echo NO-DOTENV; echo ---; docker ps --format \"{{.Names}} => {{.Image}} ports={{.Ports}} up={{.Status}}\"; echo ---; docker image ls git.dev.xram.net/atmarx/come-sit-with-me --format \"{{.Tag}} {{.ID}} created={{.CreatedAt}}\""'
      - 'ssh -o StrictHostKeyChecking=accept-new deploy@"$DROPLET_HOST" "cd /opt/projects/come-sit-with-me && docker compose -f docker-compose.production.yml config 2>/dev/null | grep -E \"image|container_name|name:\" || echo COMPOSE-CONFIG-FAILED"'
      - rsync -az scripts/deploy-production.sh deploy@"$DROPLET_HOST":/opt/projects/come-sit-with-me/_staged/
      - ssh -o StrictHostKeyChecking=accept-new deploy@"$DROPLET_HOST" bash /opt/projects/come-sit-with-me/_staged/deploy-production.sh
      - 'ssh -o StrictHostKeyChecking=accept-new deploy@"$DROPLET_HOST" "echo DIAG-POST; docker inspect come-sit-with-me-prod --format \"prod-container image={{.Image}} started={{.State.StartedAt}}\" 2>/dev/null || echo NO-PROD-CONTAINER; wget -qO- http://127.0.0.1:3011/resources/references | grep -o keeps-trial-2014 | head -1 || echo V123-MARKER-ABSENT-FROM-CONTAINER"'
      - 'echo DIAG-COMPLETE-INTENTIONAL-FAIL && exit 1'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
